name: Versioned release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag: v0.1.0-alpha.1, v0.1.0-beta.1, v0.1.0-rc.1 or v0.1.0'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: versioned-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install archive ownership support
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Check source
        run: bash tests/check.sh
      - name: Resolve immutable components
        id: components
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-components.py --repository "$GITHUB_REPOSITORY" --plan
      - name: Set up builder for missing components
        if: steps.components.outputs.needs_docker == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build missing components
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-components.py --repository "$GITHUB_REPOSITORY"
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: python3 scripts/publish-versioned-components.py "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
